name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21', cache: 'maven' }
      - name: Frontend install
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Copy frontend into Spring Boot
        run: mkdir -p src/main/resources/static && cp -R frontend/dist/. src/main/resources/static/
      - name: Backend tests and package
        shell: bash
        run: |
          set +e
          mvn -B clean test package > mvn.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "--- Maven diagnostic tail ---"
            tail -n 160 mvn.log
            exit $code
          fi
          tail -n 50 mvn.log
      - uses: actions/setup-node@v4
        with: { node-version: '24.16.0' }
      - name: OpenClaw plugin install
        working-directory: openclaw/restaurant-tools
        run: npm install --no-audit --no-fund
      - name: OpenClaw plugin tests
        working-directory: openclaw/restaurant-tools
        run: npm test
      - name: OpenClaw plugin build and manifest validation
        working-directory: openclaw/restaurant-tools
        run: npm run plugin:check
      - name: Verify secrets are not committed
        run: |
          ! git grep -nE '(WHATSAPP_ACCESS_TOKEN|AI_API_KEY|DATABASE_PASSWORD|OPENCLAW_BACKEND_SHARED_SECRET)=[^[:space:]]+' -- ':!*.example'
      - name: Docker image build
        run: docker build --tag bombay-restaurant-intelligence:ci .
