spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
app:
  owner: { username: owner, password: test-password }
  internal-api: { secret: test-shared-secret }
  normalization: { auto-post-threshold: 0.85 }
  storage: { local-root: ./target/test-storage }
  whatsapp: { mode: mock, verify-token: verify-me }
  ai: { mode: mock }
