services:
  - type: web
    name: bombay-restaurant-intelligence
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_HOST
        fromDatabase: { name: bombay-restaurant-intelligence-db, property: host }
      - key: DATABASE_PORT
        fromDatabase: { name: bombay-restaurant-intelligence-db, property: port }
      - key: DATABASE_NAME
        fromDatabase: { name: bombay-restaurant-intelligence-db, property: database }
      - key: DATABASE_USERNAME
        fromDatabase: { name: bombay-restaurant-intelligence-db, property: user }
      - key: DATABASE_PASSWORD
        fromDatabase: { name: bombay-restaurant-intelligence-db, property: password }
      - key: APP_OWNER_USERNAME
        value: owner
      - key: APP_OWNER_PASSWORD
        sync: false
      - key: WHATSAPP_MODE
        value: mock
      - key: AI_EXTRACTION_MODE
        value: mock
      - key: STORAGE_MODE
        value: local
      - key: NORMALIZATION_AUTO_POST_THRESHOLD
        value: "0.85"
